services:
  # ─── URBAN BLADE REST & REAL-TIME API BACKEND ──────────────────────────────
  - type: web
    name: urbanblade-api
    runtime: node
    rootDir: server
    plan: free
    region: oregon # Alternatives: frankfurt, ohio, singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: AUTO_MIGRATE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MIN
        value: 2
      - key: DATABASE_POOL_MAX
        value: 10
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: 10000
      - key: RATE_LIMIT_MAX
        value: 5000
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: MAX_EVENT_LOOP_DELAY_MS
        value: 2500
      - key: CORS_ORIGINS
        value: "https://urban-blade.vercel.app,https://www.urbanblade.shop,https://urbanblade.shop,https://www.urbanblade.in,https://urbanblade.in,http://localhost:4200"
      - key: REDIS_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        value: rzp_test_TZtC5tBbAEEppP
      - key: RAZORPAY_KEY_SECRET
        value: bSQij93encYPYkJK6yLzy8xm
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
