services:
  # ─── URBAN BLADE REST & REAL-TIME API BACKEND ──────────────────────────────
  - type: web
    name: urbanblade-api
    runtime: node
    rootDir: server
    plan: free
    region: oregon # Alternatives: frankfurt, ohio, singapore
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: DATABASE_URL
        fromDatabase:
          name: urbanblade-db
          property: connectionString
      - key: DATABASE_POOL_MIN
        value: 2
      - key: DATABASE_POOL_MAX
        value: 10
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: 10000
      - key: RATE_LIMIT_MAX
        value: 5000
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000

databases:
  # ─── FREE-TIER POSTGRESQL (RENDER MANAGED) ──────────────────────────────────
  - name: urbanblade-db
    databaseName: urbanblade_db
    user: urbanblade
    plan: free
    region: oregon
    ipAllowList: [] # Allow all Render services to connect
