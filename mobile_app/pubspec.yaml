name: urban_blade_mobile
description: "Urban Blade - Luxury Salon & Grooming Mobile Application"
publish_to: 'none'
version: 2.5.5+25

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  url_launcher: ^6.3.3
  razorpay_flutter: ^1.4.7
  dynamic_color: ^1.9.0
  pdf: ^3.13.1
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/repository_liquid_glass.frag
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
  assets:
    - third_party/liquid_glass/
    - assets/images/
    - assets/images/products/
    - assets/images/heroes/
