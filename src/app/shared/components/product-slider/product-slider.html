<section class="product-slider">
  <header class="product-slider__head">
    <h2>{{ title() }}</h2>
    <div class="product-slider__actions">
      @if (seeAllLink()) {
        <a [routerLink]="seeAllLink()" [queryParams]="seeAllQuery()">See all</a>
      }
      <div class="product-slider__nav">
        <button type="button" (click)="prev()" aria-label="Previous products">‹</button>
        <button type="button" (click)="next()" aria-label="Next products">›</button>
      </div>
    </div>
  </header>
  <div class="product-slider__scroller" #scroller>
    @for (product of products(); track product.id) {
      <div class="product-slider__item">
        <app-product-card [product]="product" [largeMedia]="true" />
      </div>
    }
  </div>
</section>
